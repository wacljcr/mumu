name: Regen Packages

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'gen_packages.py'
      - 'gen_depictions.py'
      - 'changelogs/**'
      - 'depictions/**'
      - 'icons/**'
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: regen depictions & index
        run: |
          python3 gen_depictions.py
          python3 gen_packages.py
      - name: commit index
        id: commit
        run: |
          git config user.email "repo-bot@users.noreply.github.com"
          git config user.name "repo-bot"
          git add Packages Packages.gz Packages.bz2 Release
          git add -A depictions
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "regen Packages & depictions" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
